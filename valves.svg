<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
<rect width="1200" height="500" rx="24" fill="#06192d"/>
<text x="55" y="58" fill="#eef8ff" font-family="Arial" font-size="30" font-weight="700">Sanitary valves — quick visual guide</text>
<text x="55" y="88" fill="#9fb6c9" font-family="Arial" font-size="16">Valve selection depends on product, pressure, temperature, cleaning and required flow control.</text>
<g transform="translate(80,150)" font-family="Arial" text-anchor="middle">
<path d="M20 60H190M20 180H190" stroke="#74d7ff" stroke-width="12"/><path d="M70 60l35 60-35 60M140 60l-35 60 35 60" fill="none" stroke="#ffcc66" stroke-width="8"/><text x="105" y="225" fill="#eef8ff" font-size="20">Butterfly</text><text x="105" y="250" fill="#9fb6c9" font-size="14">isolation / flow control</text>
</g>
<g transform="translate(365,150)" font-family="Arial" text-anchor="middle">
<path d="M20 120H190" stroke="#74d7ff" stroke-width="12"/><path d="M105 120V55M80 55h50" stroke="#ffcc66" stroke-width="8"/><path d="M85 80h40" stroke="#ffcc66" stroke-width="5"/><text x="105" y="225" fill="#eef8ff" font-size="20">Diaphragm</text><text x="105" y="250" fill="#9fb6c9" font-size="14">hygienic process service</text>
</g>
<g transform="translate(650,150)" font-family="Arial" text-anchor="middle">
<path d="M20 120H190" stroke="#74d7ff" stroke-width="12"/><path d="M105 120V55" stroke="#ffcc66" stroke-width="8"/><path d="M65 100 Q105 60 145 100" fill="none" stroke="#ffcc66" stroke-width="7"/><text x="105" y="225" fill="#eef8ff" font-size="20">Seat valve</text><text x="105" y="250" fill="#9fb6c9" font-size="14">shut-off / change-over</text>
</g>
<g transform="translate(935,150)" font-family="Arial" text-anchor="middle">
<path d="M20 120H190" stroke="#74d7ff" stroke-width="12"/><path d="M85 80l40 40-40 40M125 80l-40 40 40 40" fill="none" stroke="#ffcc66" stroke-width="6"/><text x="105" y="225" fill="#eef8ff" font-size="20">Mixproof</text><text x="105" y="250" fill="#9fb6c9" font-size="14">separates media safely</text>
</g>
<text x="600" y="435" text-anchor="middle" fill="#74d7ff" font-family="Arial" font-size="17">A hygienic valve must be cleanable and designed to minimise product retention and contamination risk.</text>
</svg>