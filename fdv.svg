<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540">
<rect width="1000" height="540" rx="28" fill="#031426" stroke="#145681" stroke-width="3"/>
<text x="50" y="60" fill="#f2f6fb" font-family="Arial" font-size="30" font-weight="700">Flow Diversion Valve (FDV)</text>
<text x="50" y="92" fill="#9fb4c7" font-family="Arial" font-size="17">A safety-critical device that separates acceptable forward flow from under-pasteurized flow.</text>
<g stroke="#9fb4c7" stroke-width="28" fill="none" stroke-linecap="round"><path d="M160 250 H410"/><path d="M590 250 H850"/><path d="M500 160 V80"/><path d="M500 340 V440"/></g>
<circle cx="500" cy="250" r="82" fill="#07253c" stroke="#29a9ff" stroke-width="7"/><path d="M455 250 L540 205 L540 295 Z" fill="#29a9ff"/>
<text x="500" y="257" fill="#f2f6fb" font-family="Arial" font-size="20" text-anchor="middle">FDV</text>
<g font-family="Arial" font-size="19"><text x="120" y="220" fill="#f2f6fb">From holding tube</text><text x="620" y="220" fill="#7fd1ff">FORWARD → regeneration/cooling</text><text x="555" y="125" fill="#ffb06d">DIVERT → balance tank</text><text x="555" y="475" fill="#9fb4c7">Temperature sensor + controller</text></g>
<rect x="90" y="395" width="310" height="65" rx="14" fill="#071f33" stroke="#24516f"/><text x="245" y="435" fill="#bfe4f8" font-family="Arial" font-size="17" text-anchor="middle">Temperature ≥ set point</text>
<rect x="600" y="395" width="310" height="65" rx="14" fill="#071f33" stroke="#24516f"/><text x="755" y="435" fill="#ffcfb0" font-family="Arial" font-size="17" text-anchor="middle">Temperature below set point</text>
</svg>
