<text x="55" y="60" fill="#f2f6fb" font-family="Arial" font-size="30" font-weight="700">Plate Heat Exchanger — Counter-Current Flow</text>
<text x="55" y="92" fill="#9fb4c7" font-family="Arial" font-size="17">Corrugated plates create alternate channels and promote turbulence for efficient heat transfer.</text>
