<g font-family="Arial"><text x="70" y="555" fill="#b8c9d7" font-size="18">Key idea:</text><text x="170" y="555" fill="#f2f6fb" font-size="18">hot pasteurized milk transfers heat to incoming cold raw milk in the regeneration section.</text></g>
