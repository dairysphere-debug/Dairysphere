<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#041625"/><stop offset="1" stop-color="#071e31"/></linearGradient><linearGradient id="steel" x1="0" x2="1"><stop stop-color="#607889"/><stop offset=".5" stop-color="#d9e4ea"/><stop offset="1" stop-color="#607889"/></linearGradient></defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<text x="60" y="65" fill="#eaf6ff" font-family="Arial" font-size="30" font-weight="700">Insulated / Double-Wall Piping</text>
<text x="60" y="98" fill="#8da8ba" font-family="Arial" font-size="16">Conceptual cross-section for temperature-controlled service</text>
<circle cx="390" cy="280" r="155" fill="none" stroke="#159df2" stroke-width="8"/>
<circle cx="390" cy="280" r="105" fill="#1d3343" stroke="url(#steel)" stroke-width="16"/>
<circle cx="390" cy="280" r="74" fill="#6bb8e9" opacity=".75"/>
<text x="355" y="286" fill="#031522" font-family="Arial" font-size="18" font-weight="700">PRODUCT</text>
<text x="575" y="180" fill="#9fdcff" font-family="Arial" font-size="19">Outer protective layer</text><line x1="565" y1="188" x2="465" y2="215" stroke="#42bfff" stroke-width="2"/>
<text x="575" y="245" fill="#9fdcff" font-family="Arial" font-size="19">Insulation / thermal barrier</text><line x1="565" y1="252" x2="480" y2="270" stroke="#42bfff" stroke-width="2"/>
<text x="575" y="310" fill="#9fdcff" font-family="Arial" font-size="19">Sanitary process tube</text><line x1="565" y1="318" x2="445" y2="300" stroke="#42bfff" stroke-width="2"/>
<text x="575" y="375" fill="#9fdcff" font-family="Arial" font-size="19">Product-contact bore</text><line x1="565" y1="383" x2="445" y2="325" stroke="#42bfff" stroke-width="2"/>
<rect x="720" y="150" width="370" height="220" rx="20" fill="#061b2c" stroke="#1a5477"/>
<text x="750" y="195" fill="#eaf6ff" font-family="Arial" font-size="21" font-weight="700">Why use insulation?</text>
<text x="750" y="235" fill="#a9c0cf" font-family="Arial" font-size="16">• Reduces heat loss in hot services</text>
<text x="750" y="270" fill="#a9c0cf" font-family="Arial" font-size="16">• Reduces heat gain in chilled services</text>
<text x="750" y="305" fill="#a9c0cf" font-family="Arial" font-size="16">• Helps control external condensation</text>
<text x="750" y="340" fill="#a9c0cf" font-family="Arial" font-size="16">• Protects operators from hot surfaces</text>
</svg>