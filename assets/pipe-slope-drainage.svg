<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650">
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#041625"/><stop offset="1" stop-color="#071e31"/></linearGradient></defs>
<rect width="1200" height="650" rx="28" fill="url(#bg)"/>
<text x="55" y="58" fill="#eaf6ff" font-family="Arial" font-size="29" font-weight="700">Pipe Slope &amp; Drainage</text>
<text x="55" y="88" fill="#8da8ba" font-family="Arial" font-size="15">The objective is a continuous fall to a defined low-point drain</text>
<text x="70" y="150" fill="#42bfff" font-family="Arial" font-size="20" font-weight="700">CORRECT • CONTINUOUS FALL</text>
<path d="M90 225 L720 350" stroke="#dce8ed" stroke-width="20" fill="none" stroke-linecap="round"/>
<path d="M720 350 L720 455" stroke="#159df2" stroke-width="12" fill="none"/>
<path d="M720 455 l-22 -32 h44 z" fill="#159df2"/>
<line x1="90" y1="180" x2="720" y2="305" stroke="#42bfff" stroke-width="2" stroke-dasharray="8 8"/>
<text x="285" y="195" fill="#9fdcff" font-family="Arial" font-size="16">Continuous downward route</text>
<text x="755" y="375" fill="#9fdcff" font-family="Arial" font-size="17">LOW-POINT</text>
<text x="755" y="399" fill="#9fdcff" font-family="Arial" font-size="17">DRAIN</text>
<text x="70" y="515" fill="#42bfff" font-family="Arial" font-size="20" font-weight="700">INCORRECT • UNINTENDED LOW POCKET</text>
<path d="M90 575 L330 530 L540 590 L850 540" stroke="#dce8ed" stroke-width="20" fill="none" stroke-linecap="round"/>
<circle cx="540" cy="590" r="22" fill="#159df2"/><text x="575" y="600" fill="#9fdcff" font-family="Arial" font-size="16">Liquid can remain trapped here</text>
<text x="930" y="190" fill="#b9cbd7" font-family="Arial" font-size="15">Typical drainable-line practice</text>
<text x="930" y="218" fill="#b9cbd7" font-family="Arial" font-size="15">may use about 0.3–0.5%</text>
<text x="930" y="246" fill="#b9cbd7" font-family="Arial" font-size="15">slope (3–5 mm/m), subject</text>
<text x="930" y="274" fill="#b9cbd7" font-family="Arial" font-size="15">to the actual design.</text>
</svg>